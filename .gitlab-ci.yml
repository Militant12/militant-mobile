image: instrumentisto/flutter:latest

stages:
  - test
  - build
  - deploy

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

before_script:
  - flutter --version
  - flutter pub get

# Tests
test:
  stage: test
  script:
    - flutter analyze
    - flutter test
  only:
    - merge_requests
    - main

# Build Android Debug
build_android_debug:
  stage: build
  script:
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week
  only:
    - main
    - develop

# Build Android Release (signé)
# Note: Nécessite les variables GitLab CI/CD configurées
# Pour builder en local: flutter build appbundle --release
build_android_release:
  stage: build
  before_script:
    - flutter --version
    - flutter pub get
  script:
    # Vérifier que les variables existent
    - |
      if [ -z "$KEYSTORE_FILE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
        echo "❌ Variables de signature manquantes !"
        echo "Variables requises: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS"
        exit 1
      fi
    # Décoder le keystore
    - echo "$KEYSTORE_FILE" | base64 -d > /tmp/release-key.jks
    - ls -lh /tmp/release-key.jks
    # Créer le fichier key.properties
    - echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
    - echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
    - echo "keyAlias=$KEY_ALIAS" >> android/key.properties
    - echo "storeFile=/tmp/release-key.jks" >> android/key.properties
    - cat android/key.properties
    # Builder l'app
    - flutter build apk --release
    - flutter build appbundle --release
    - ls -lh build/app/outputs/bundle/release/
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: 1 month
  only:
    - tags
  when: manual

# Build iOS (nécessite un runner macOS)
build_ios:
  stage: build
  script:
    - flutter build ios --release --no-codesign
  artifacts:
    paths:
      - build/ios/iphoneos/Runner.app
    expire_in: 1 month
  only:
    - tags
  tags:
    - macos

# Déploiement automatique (optionnel)
deploy_internal:
  stage: deploy
  script:
    - echo "Déploiement sur canal interne"
    # Ajouter ici les commandes de déploiement
  only:
    - tags
  when: manual
