<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Militant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #BE1E1E;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #AAAAAA;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #BE1E1E;
            color: white;
            padding: 14px 28px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100" height="100" style="margin-bottom: 20px; border-radius: 20px;">
          <rect width="400" height="400" rx="40" fill="#be1e1e"/>
          <clipPath id="clip">
            <rect width="400" height="400" rx="40"/>
          </clipPath>
          <polygon points="400,0 400,400 0,400" fill="#111" clip-path="url(#clip)"/>
          
          <g fill="#fff">
            <polygon points="80,320 80,100 130,100 200,220 270,100 320,100 320,320 270,320 270,180 200,300 130,180 130,320"/>
          </g>
          
          <line x1="0" y1="400" x2="400" y2="0" stroke="#fff" stroke-width="1" opacity="0.15" clip-path="url(#clip)"/>
        </svg>
        <h1>Pas de connexion</h1>
        <p>Vous êtes actuellement hors ligne. Vérifiez votre connexion Internet pour accéder à Militant.</p>
        <a href="#" onclick="location.reload(); return false;" class="btn">Réessayer</a>
    </div>
</body>
</html>
